[project]
name = "lingbot-depth-coreml-validation"
version = "0.1.0"
description = "MLX inference, Core ML validation, and iPad RGB-D capture"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy>=2,<3", "opencv-python>=4,<6", "coremltools>=9,<10"]

[project.optional-dependencies]
mlx = ["mlx>=0.32,<0.33"]
viewer = ["viser>=1,<2"]
test = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
